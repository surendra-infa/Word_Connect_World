<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#123a5c"/>
      <stop offset="1" stop-color="#0b2a45"/>
    </linearGradient>
    <linearGradient id="wGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="w2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- WCW letter tiles, one vibrant color each -->
  <g font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="84" font-weight="800" text-anchor="middle" dominant-baseline="central" filter="url(#shadow)">
    <g>
      <rect x="40" y="186" width="132" height="140" rx="26" fill="url(#wGrad)" stroke="#fde68a" stroke-width="3"/>
      <text x="106" y="262" fill="#451a03">W</text>
    </g>
    <g>
      <rect x="190" y="186" width="132" height="140" rx="26" fill="url(#cGrad)" stroke="#a7f3d0" stroke-width="3"/>
      <text x="256" y="262" fill="#022c22">C</text>
    </g>
    <g>
      <rect x="340" y="186" width="132" height="140" rx="26" fill="url(#w2Grad)" stroke="#bae6fd" stroke-width="3"/>
      <text x="406" y="262" fill="#082f49">W</text>
    </g>
  </g>

  <!-- connecting dots between tiles -->
  <circle cx="181" cy="256" r="7" fill="#fde047" opacity="0.9"/>
  <circle cx="331" cy="256" r="7" fill="#4ade80" opacity="0.9"/>

  <!-- sparkle accents -->
  <g fill="#fffbeb" opacity="0.95">
    <path d="M414 104 l7 20 l20 7 l-20 7 l-7 20 l-7 -20 l-20 -7 l20 -7 z"/>
  </g>
  <g fill="#fffbeb" opacity="0.7">
    <path d="M92 392 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z"/>
  </g>
</svg>
