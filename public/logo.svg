<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.55" stop-color="#0d5750"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- connecting hexagonal lines between letter nodes -->
  <g stroke="#5eead4" stroke-width="7" stroke-linecap="round" opacity="0.5" fill="none">
    <line x1="256" y1="150" x2="347" y2="203"/>
    <line x1="347" y1="203" x2="347" y2="309"/>
    <line x1="347" y1="309" x2="256" y2="362"/>
    <line x1="256" y1="362" x2="165" y2="309"/>
    <line x1="165" y1="309" x2="165" y2="203"/>
    <line x1="165" y1="203" x2="256" y2="150"/>
    <line x1="256" y1="150" x2="256" y2="362" opacity="0.35"/>
    <line x1="165" y1="203" x2="347" y2="309" opacity="0.35"/>
    <line x1="347" y1="203" x2="165" y2="309" opacity="0.35"/>
  </g>

  <!-- letter nodes: W-O-R-D-L-K arranged around the circle -->
  <g font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" text-anchor="middle" dominant-baseline="central" filter="url(#shadow)">
    <!-- top (W) - the highlighted "found" node -->
    <circle cx="256" cy="150" r="52" fill="url(#amber)" stroke="#fde68a" stroke-width="3"/>
    <text x="256" y="152" fill="#451a03">W</text>

    <circle cx="347" cy="203" r="46" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.5"/>
    <text x="347" y="205" fill="#0f766e">O</text>

    <circle cx="347" cy="309" r="46" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.5"/>
    <text x="347" y="311" fill="#0f766e">R</text>

    <circle cx="256" cy="362" r="46" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.5"/>
    <text x="256" y="364" fill="#0f766e">D</text>

    <circle cx="165" cy="309" r="46" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.5"/>
    <text x="165" y="311" fill="#0f766e">L</text>

    <circle cx="165" cy="203" r="46" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.5"/>
    <text x="165" y="205" fill="#0f766e">K</text>
  </g>

  <!-- small sparkle on the found node -->
  <g fill="#fffbeb" opacity="0.95">
    <path d="M256 86 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 l18 -6 z"/>
  </g>
</svg>
